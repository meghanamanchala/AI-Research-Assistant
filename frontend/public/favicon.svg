  <!-- Magnifying glass circle -->
  <circle cx="27" cy="26" r="14" fill="none" stroke="white" stroke-width="4" opacity="0.95"/>
  <!-- Neural network dots inside lens -->
  <circle cx="22" cy="22" r="2.5" fill="white" opacity="0.9"/>
  <circle cx="32" cy="22" r="2.5" fill="white" opacity="0.9"/>
  <circle cx="27" cy="30" r="2.5" fill="white" opacity="0.9"/>
  <!-- Neural connections -->
  <line x1="22" y1="22" x2="32" y2="22" stroke="white" stroke-width="1.5" opacity="0.65"/>
  <line x1="22" y1="22" x2="27" y2="30" stroke="white" stroke-width="1.5" opacity="0.65"/>
  <line x1="32" y1="22" x2="27" y2="30" stroke="white" stroke-width="1.5" opacity="0.65"/>
  <!-- Handle -->
  <line x1="37" y1="37" x2="51" y2="51" stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.95"/>
